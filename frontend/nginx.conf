server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve "api" through Docker's DNS at request time: a recreated API
    # container gets a new IP, which a name resolved once at startup misses.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API: /api/campaigns -> http://api:8080/campaigns.
    location /api/ {
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Fail fast when the API is down instead of hanging for a minute.
        proxy_connect_timeout 5s;
        # Server-sent events (content generation, live dashboard) must reach
        # the browser as they are written, and may stay open for minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
